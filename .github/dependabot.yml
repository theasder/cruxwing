version: 2

# Dependabot only opens reviewed pull requests. It never merges or publishes.
# `mvp/` is intentionally absent because its Package.swift has no remote
# dependencies.
updates:
  - package-ecosystem: "swift"
    directory: "/app"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Warsaw"
    open-pull-requests-limit: 4
    groups:
      swift-patches:
        patterns:
          - "*"
        update-types:
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "thursday"
      time: "06:00"
      timezone: "Europe/Warsaw"
    open-pull-requests-limit: 3
    groups:
      action-patches:
        patterns:
          - "*"
        update-types:
          - "patch"
