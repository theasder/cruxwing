# Форма для нового коннектора — и она же тот самый гейт.
#
# Правило проекта: метод, адрес, параметр поиска и форма ответа проверяются в
# документации вендора ДО кнопки (CONTRIBUTING, «не заявляйте того, чего нет»).
# Раньше это выяснялось в пулл-реквесте, то есть после того, как человек написал
# код — самый дорогой момент, чтобы услышать «у этого сервиса нет поиска». На
# этой проверке уже отсеялись Pyrus, Мегаплан, Яндекс Вики, Teamly и GigaChat.
#
# Поэтому четыре поля обязательны, и все четыре — цитаты из чужой документации,
# а не наши намерения. Если хоть одно нечем заполнить, ответ известен заранее, и
# форма экономит день работы обеим сторонам.
name: Новый коннектор
description: Подключить сервис — трекер, мессенджер, базу знаний
body:
  - type: markdown
    attributes:
      value: |
        Нашли сервис, к которому не хватает коннектора, — спасибо. Четыре поля
        ниже это то, что проверяется до написания кода: если на них есть ответы
        из документации вендора, дальше это работа на день.

        Не нашли какое-то из них — заводите issue всё равно, только напишите
        прямо, чего в справке нет. «В открытой документации метода поиска нет» —
        это результат проверки, а не неудача: ровно так закрылись Яндекс Вики и
        Teamly, и это записано, чтобы никто не искал второй раз.

  - type: input
    id: servis
    attributes:
      label: Сервис
      placeholder: "Yonote, GitVerse, Plane"
    validations:
      required: true

  - type: input
    id: dokumentatsiya
    attributes:
      label: Ссылка на документацию вендора
      description: >
        Именно на страницу метода, а не на обзорную. Всё, что ниже, должно
        читаться по этому адресу — иначе коннектор написан по догадке.
      placeholder: "https://developers.example.ru/api/tasks"
    validations:
      required: true

  - type: input
    id: metod
    attributes:
      label: Метод и адрес запроса
      description: Как в справке, вместе с базовым адресом.
      placeholder: "GET https://api.example.ru/public/v1/tm/tasks"
    validations:
      required: true

  - type: input
    id: poisk
    attributes:
      label: Параметр поиска по тексту
      description: >
        Имя параметра, которым ищут по словам. Перечисление задач поиском не
        считается: выдача, которую мы фильтруем у себя, на большом проекте
        отвечает «ничего не нашлось» по полному архиву.
      placeholder: "search=  ·  q=  ·  query="
    validations:
      required: true

  - type: textarea
    id: otvet
    attributes:
      label: Форма ответа
      description: >
        Где в JSON лежит список и где заголовок задачи. Достаточно куска ответа
        из справки — по нему видно, что разбирать.
      placeholder: |
        { "success": true,
          "tasks": [ { "id": 42, "title": "Починить экспорт" } ] }
      render: json
    validations:
      required: true

  - type: dropdown
    id: dostup
    attributes:
      label: У вас есть рабочий аккаунт этого сервиса
      description: >
        Коннектор проверяется на живом сервисе (`LiveConnectorProbe`), и
        сделать это может только тот, у кого есть доступ. Токен при этом
        остаётся у вас: он берётся из окружения и в репозиторий не попадает.
      options:
        - Да, могу прогнать проверку на живом сервисе
        - Нет, только документация
    validations:
      required: true

  - type: textarea
    id: proverka
    attributes:
      label: Ответ живого сервиса, если запускали
      description: >
        Вывод `LiveConnectorProbe` или ответ сервиса без токена и без личных
        данных. Именно этого не хватает Битрикс24: он написан по документации,
        и об этом сказано прямо, потому что портала у нас нет.
      placeholder: |
        cd app && CRUXWING_PROBE_SERVICE=… CRUXWING_PROBE_TOKEN=… \
          bash scripts/test-filter.sh app LiveConnectorProbe
    validations:
      required: false
