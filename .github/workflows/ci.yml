# Прогон тестов на каждый пулл-реквест.
#
# Зачем. В проекте отдельные наборы приложения, ядра, страницы и документации;
# раньше их запускал только автор у себя. Для человека со
# стороны это значит, что сломанный пулл-реквест выясняется в переписке, через
# день, на словах: худший способ узнать. CI переносит ответ на минуту после
# `git push` и делает набор тестов инструментом участника, а не частным
# ритуалом сопровождающего.
#
# macOS, а не Linux: приложение нативное (SwiftUI, ScreenCaptureKit, Связка
# ключей). На Linux оно не собирается вовсе, и «зелёный» Linux-прогон означал бы
# ровно ничего.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Tests only need to read the checkout. Keep the automatic token least-
# privileged even if the repository's organization default changes later.
permissions:
  contents: read

# Пулл-реквест, обновлённый дважды подряд, не должен занимать раннеры двумя
# прогонами — первый отменяется. На main отмена запрещена: там у каждого
# коммита должен быть собственный ответ.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  swift:
    name: Тесты приложения (macOS)
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Версия Swift
        run: swift --version

      # Кэш сборки. В репозитории `.build/` игнорируется намеренно — это
      # промежуточные файлы компилятора, и однажды они уже попали в историю и
      # раздули её до 114 МБ. Здесь тот же каталог уместен: он живёт в кэше
      # раннера, а не в репозитории.
      - name: Кэш SwiftPM
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: app/.build
          key: swiftpm-${{ runner.os }}-${{ hashFiles('app/Package.resolved') }}
          restore-keys: swiftpm-${{ runner.os }}-

      - name: Тесты приложения
        working-directory: app
        run: swift test

      - name: Тесты mvp
        working-directory: mvp
        run: swift test

  # Ядро без Apple. Обещание «порт стоит только захвата звука и оболочки»
  # (план, §7.1) держалось на `PortabilityTests`, который читает импорты. Это
  # проверка намерения: она не собирает ядро нигде, кроме macOS, и не заметит
  # вызова Foundation, которого в swift-corelibs-foundation нет.
  #
  # Здесь ядро и командная строка собираются на Linux по-настоящему. Окно
  # (SwiftUI) объявлено в манифесте условно и на этой системе не существует:
  # уберут условие — задание упадёт на первой же строке про SwiftUI.
  linux-core:
    name: Ядро и командная строка (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: swift:6.0@sha256:0bdd33b44c0493bdf6a674700ce8960cff301977125cff2ced94770d13d7a921
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Версия Swift
        run: swift --version

      - name: Сборка ядра
        working-directory: mvp
        run: swift build --target OrakulCore

      # Командная строка тоже: запись с микрофона убрана под
      # `#if canImport(AVFoundation)` и заменена ошибкой с объяснением, а не
      # пустым массивом. Это обязано компилироваться, иначе «работает всё,
      # кроме записи» — неправда.
      - name: Сборка командной строки
        working-directory: mvp
        run: swift build

      # Набор целиком. 2026-08-17 он впервые собрался и запустился на Linux и
      # дал 9 замечаний в трёх классах; все три закрыты в тот же день:
      #
      #   1. Windows-1251 — своя таблица (`CP1251`), потому что у corelibs этой
      #      кодировки нет вовсе, а расшифровку в ней делает как раз Windows;
      #   2. поведение Foundation — `URL(string: "")` там непустой, а
      #      `replaceItemAt` на повторном сохранении отвечает «файла нет»;
      #   3. права доступа — под root они не действуют, и проверки отказа
      #      пропускаются с названной причиной (`PermissionProbe`), а не падают.
      #
      # Пропуски видны в выводе поимённо: тест, «пройденный» потому, что не
      # запускался, — худший вид зелёного.
      - name: Тесты ядра
        working-directory: mvp
        run: swift test

      # Защиты коннекторов — против настоящего сокета, и именно на этой системе.
      #
      # 2026-08-19 измерено, что поведение Foundation при перенаправлении на
      # чужой хост РАЗНОЕ: macOS снимает заголовок Authorization, corelibs на
      # Linux переносит его целиком. Значит здесь делегат из ConnectorSession —
      # единственное, что стоит между токеном от чужого трекера и адресом,
      # который назвал сам сервис. Проверки на macOS для этого не хватает: там
      # утечку прикрывает чужая библиотека, а не наше правило.
      #
      # Скрипт не считает пропущенный набор пройденным: Swift Testing на
      # выключенном `.enabled(if:)` печатает «6 tests passed after 0.001
      # seconds», поэтому доказательством служит счётчик посещений чужого
      # хоста, а не строка отчёта.
      - name: Защиты против недружелюбного сервиса (настоящий сокет)
        run: |
          apt-get update -qq
          apt-get install -y -qq python3 curl
          bash scripts/vrazhdebnaya-proba.sh

      # И собранную программу — запуском, а не чтением.
      #
      # Набор проверяет функции, этот шаг — то, что человек запускает. Разница
      # не теоретическая: 2026-08-18 команда `записать` на Linux печатала
      # «Записываю 5 с. Говорите…» и только потом сообщала, что записи здесь нет
      # вовсе. Все тесты при этом были зелёными: функция вела себя ровно так,
      # как задумано, а программа звала человека говорить в микрофон, которого
      # не существует.
      - name: Прогон собранной программы
        run: |
          swift build --package-path mvp -c release
          bash scripts/smoke-linux.sh


  # Пакет — отдельным заданием и БЕЗ контейнера Swift. Это не оформление.
  #
  # 2026-08-18 выяснилось, что первый собранный .deb на машине пользователя не
  # работал вовсе: «error while loading shared libraries: libswiftCore.so».
  # Проверка этого не показала, потому что шла внутри swift:6.0, где рантайм
  # есть по определению. Артефакт проверяли в среде, которая ему льстит.
  #
  # Теперь сборка идёт в одном образе, а установка — в чистом debian:12, где
  # Swift никогда не стоял. Собирается на jammy (glibc 2.35) намеренно: образ
  # 24.04 требует GLIBC_2.38, которого нет ни в Debian 12, ни в Ubuntu 22.04.
  linux-package:
    name: Пакет .deb (сборка и установка в чистую систему)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # Static Linux SDK ставится перед сборкой: без него пакет привязан к glibc
      # того образа, где собран, и не ставится ни на ALT p10 (glibc 2.32), ни на
      # Astra 1.7 (2.28) — то есть ровно там, где он нужнее всего. Со статической
      # сборкой зависимостей нет вовсе; проверено запуском на обеих системах.
      - name: Сборка пакета (статически)
        run: |
          docker run --rm -e ORAKUL_HEIGHT="$(git rev-list --count HEAD)" \
            -v "$PWD":/repo -w /repo swift:6.0@sha256:0bdd33b44c0493bdf6a674700ce8960cff301977125cff2ced94770d13d7a921 bash -c '
              swift sdk install \
                "https://download.swift.org/swift-6.0.3-release/static-sdk/swift-6.0.3-RELEASE/swift-6.0.3-RELEASE_static-linux-0.0.1.artifactbundle.tar.gz" \
                --checksum 67f765e0030e661a7450f7e4877cfe008db4f57f177d5a08a6e26fd661cdd0bd >/dev/null
              bash scripts/package-linux.sh
            '

      - name: Установка на ALT p10 — систему, ради которой всё это
        run: |
          docker run --rm -v "$PWD/exports/linux":/x alt:p10@sha256:5edc92edf6bc866824427f05834ffff3f815974fc1cd9840e0dda2492d11ce30 sh -c '
            set -e
            dpkg-deb -x /x/*.deb /tmp/p 2>/dev/null || { apt-get update >/dev/null; apt-get install -y dpkg >/dev/null; dpkg-deb -x /x/*.deb /tmp/p; }
            export ORAKUL_HOME=/tmp/архив
            printf "Аня: По тарифам решили поднять на пятнадцать процентов.\n" > /tmp/р.txt
            /tmp/p/usr/bin/orakul добавить /tmp/р.txt "Планёрка" >/dev/null
            /tmp/p/usr/bin/orakul найти что решили по тарифам | grep -q "пятнадцать процентов"
            echo "работает на ALT p10 (glibc 2.32) — статическая сборка сняла привязку"
          '

      - name: Установка в чистый debian:12 и прогон
        run: |
          docker run --rm -v "$PWD/exports/linux":/x debian:12@sha256:6ebd97fa83deb272194a2cf015b3d26a4d538e9ad3a7a79d544c8af5b0a01443 sh -c '
            set -e
            apt-get update >/dev/null
            apt-get install -y /x/*.deb >/dev/null
            export ORAKUL_HOME=/tmp/архив
            printf "Аня: По тарифам решили поднять на пятнадцать процентов.\n" > /tmp/р.txt
            orakul добавить /tmp/р.txt "Планёрка"
            orakul найти что решили по тарифам | grep -q "пятнадцать процентов"
            orakul найти когда корпоратив | grep -q "придумывать не буду"
            echo "пакет работает на системе без Swift"
          '

      # RPM собирается в образе СЕМЕЙСТВА RPM, а не переупаковкой того же файла.
      # Программа, собранная на Ubuntu, тянет `libcurl.so.4(CURL_OPENSSL_4)` —
      # версионированный символ Ubuntu, которого в Fedora нет. Сама она там
      # работает, но dnf отказывается ставить пакет, и это правильно: проверка
      # зависимостей строже загрузчика.
      # RPM берёт ТОТ ЖЕ статический файл, что и deb. Раньше он собирался в
      # образе семейства RPM ради правильных зависимостей — со статической
      # сборкой зависимостей нет вовсе, и образ упаковки перестал что-либо
      # значить. Заодно исчезла причина, по которой rpm не ставился на ALT.
      - name: Сборка пакета .rpm из той же статической программы
        run: |
          mkdir -p exports/static
          cp exports/linux/orakul_*/usr/bin/orakul exports/static/orakul
          docker run --rm -e ORAKUL_RELEASE="$(git rev-list --count HEAD)" \
            -v "$PWD":/repo -w /repo fedora:40@sha256:3c86d25fef9d2001712bc3d9b091fc40cf04be4767e48f1aa3b785bf58d300ed \
            bash -c 'dnf install -y rpm-build >/dev/null && bash scripts/package-rpm.sh'

      - name: Установка .rpm на ALT p10 и в чистую fedora:40
        run: |
          docker run --rm -v "$PWD/exports/linux":/x alt:p10@sha256:5edc92edf6bc866824427f05834ffff3f815974fc1cd9840e0dda2492d11ce30 bash -c '
            set -e
            rpm -i /x/*.rpm
            export ORAKUL_HOME=/tmp/архив
            printf "Аня: По тарифам решили поднять на пятнадцать процентов.\n" > /tmp/р.txt
            orakul добавить /tmp/р.txt "Планёрка" >/dev/null
            orakul найти что решили по тарифам | grep -q "пятнадцать процентов"
            echo "rpm ставится на ALT p10 — там, где обычная сборка не ставилась"
          '
          docker run --rm -v "$PWD/exports/linux":/x fedora:40@sha256:3c86d25fef9d2001712bc3d9b091fc40cf04be4767e48f1aa3b785bf58d300ed bash -c '
            set -e
            dnf install -y /x/*.rpm >/dev/null
            export ORAKUL_HOME=/tmp/архив
            printf "Аня: По тарифам решили поднять на пятнадцать процентов.\n" > /tmp/р.txt
            orakul добавить /tmp/р.txt "Планёрка"
            orakul найти что решили по тарифам | grep -q "пятнадцать процентов"
            echo "rpm работает на системе без Swift"
          '

      # Из какого кода собран артефакт — читается из САМОГО файла.
      # Собранное и выложенное путают регулярно: сборка зелёная, файл на месте,
      # а в публикации вчерашний. Коммита для этого мало — при незакоммиченном
      # дереве он одинаков у всех сборок подряд.
      - name: Прослеживаемость пакетов
        run: |
          docker run --rm -v "$PWD":/repo -w /repo debian:12@sha256:6ebd97fa83deb272194a2cf015b3d26a4d538e9ad3a7a79d544c8af5b0a01443 \
            bash scripts/audit-package.sh exports/linux/*.deb
          docker run --rm -v "$PWD":/repo -w /repo fedora:40@sha256:3c86d25fef9d2001712bc3d9b091fc40cf04be4767e48f1aa3b785bf58d300ed \
            bash scripts/audit-package.sh exports/linux/*.rpm

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: orakul-packages
          path: |
            exports/linux/*.deb
            exports/linux/*.rpm

  node:
    name: Тесты документации и страницы
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          # Вся история, а не последний коммит: здесь ищут секреты по всем
          # коммитам. С обычным shallow-клоном проверка увидела бы один
          # коммит и прошла бы, ничего не проверив.
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      # Ни одной зависимости: набор написан на `node --test`. Ставить нечего, и
      # `npm ci` здесь упал бы на отсутствующем package-lock.json.
      - name: Секреты во всей достижимой истории и текущих входах
        run: npm run audit:history

      - name: Тесты страницы, README и плана
        run: npm test
