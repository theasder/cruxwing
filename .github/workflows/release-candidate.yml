# Build a reviewable macOS release candidate from an existing annotated tag.
#
# This workflow deliberately DOES NOT create or publish a GitHub Release. The
# owner must configure the protected `release` environment, add Apple secrets,
# approve the run, download and verify the candidate, and publish it explicitly.
name: Release candidate (manual, no publish)

run-name: Candidate ${{ inputs.tag }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing annotated tag, exactly vX.Y.Z
        required: true
        type: string

concurrency:
  group: release-candidate-${{ inputs.tag }}
  cancel-in-progress: false

# No release mutation is permitted. `attestations` and OIDC are used only to
# sign artifact provenance; the candidate is retained as a private Actions
# artifact until the owner chooses to publish it.
permissions:
  contents: read
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  macos:
    name: Build, audit and attest both DMGs
    runs-on: macos-15
    timeout-minutes: 120
    environment: release
    env:
      EXPECTED_REPOSITORY: theasder/cruxwing
      RELEASE_TAG: ${{ inputs.tag }}
      RELEASE_OUTPUT: ${{ runner.temp }}/cruxwing-release-candidate
      CRUXWING_CI_KEYCHAIN: ${{ runner.temp }}/cruxwing-signing.keychain-db
      NOTARY_PROFILE: cruxwing-ci-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Refuse the wrong repository or workflow ref
        run: |
          set -euo pipefail
          if [ "$GITHUB_REPOSITORY" != "$EXPECTED_REPOSITORY" ]; then
            echo "Refusing to prepare Cruxwing artifacts from $GITHUB_REPOSITORY." >&2
            echo "The owner must first restore $EXPECTED_REPOSITORY." >&2
            exit 1
          fi
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Release tag must have the exact form vX.Y.Z." >&2
            exit 1
          fi
          if [ "$GITHUB_REF" != "refs/tags/$RELEASE_TAG" ]; then
            echo "Dispatch this workflow from the same tag passed as input." >&2
            echo "Expected refs/tags/$RELEASE_TAG; received $GITHUB_REF." >&2
            exit 1
          fi

      - name: Check out the requested tag with full history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Use the same Node line as CI
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc

      - name: Prove tag, version, ancestry and clean checkout
        run: |
          set -euo pipefail
          bash scripts/release-gate.sh "$RELEASE_TAG"

      # A release run must establish its own evidence. A green check on a
      # similarly named branch is not evidence for the exact tagged commit.
      - name: Test the exact tagged source
        run: |
          set -euo pipefail
          npm test
          (cd mvp && swift test)
          (cd app && swift test)

      - name: Require owner-supplied Apple credentials
        env:
          APPLE_DEVELOPER_ID_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          APPLE_NOTARY_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          for name in \
            APPLE_DEVELOPER_ID_P12_BASE64 \
            APPLE_DEVELOPER_ID_P12_PASSWORD \
            APPLE_NOTARY_KEY_P8_BASE64 \
            APPLE_NOTARY_KEY_ID \
            APPLE_NOTARY_ISSUER_ID; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required release-environment secret: $name" >&2
              exit 1
            fi
          done

          umask 077
          certificate="$RUNNER_TEMP/cruxwing-developer-id.p12"
          api_key="$RUNNER_TEMP/cruxwing-notary-key.p8"
          CRUXWING_CERTIFICATE_PATH="$certificate" \
          CRUXWING_NOTARY_KEY_PATH="$api_key" \
          python3 <<'PY'
          import base64
          import os
          from pathlib import Path

          for source, target in [
              ("APPLE_DEVELOPER_ID_P12_BASE64", "CRUXWING_CERTIFICATE_PATH"),
              ("APPLE_NOTARY_KEY_P8_BASE64", "CRUXWING_NOTARY_KEY_PATH"),
          ]:
              try:
                  decoded = base64.b64decode(os.environ[source], validate=True)
              except Exception as error:
                  raise SystemExit(f"{source} is not valid base64: {error}")
              if not decoded:
                  raise SystemExit(f"{source} decoded to an empty file")
              Path(os.environ[target]).write_bytes(decoded)
          PY

          keychain_password="$(openssl rand -hex 32)"
          security create-keychain -p "$keychain_password" "$CRUXWING_CI_KEYCHAIN"
          security set-keychain-settings -lut 21600 "$CRUXWING_CI_KEYCHAIN"
          security unlock-keychain -p "$keychain_password" "$CRUXWING_CI_KEYCHAIN"
          security import "$certificate" \
            -k "$CRUXWING_CI_KEYCHAIN" \
            -f pkcs12 \
            -P "$APPLE_DEVELOPER_ID_P12_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security >/dev/null
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$keychain_password" "$CRUXWING_CI_KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$CRUXWING_CI_KEYCHAIN"
          security default-keychain -d user -s "$CRUXWING_CI_KEYCHAIN"

          signing_identity="$(security find-identity -v -p codesigning "$CRUXWING_CI_KEYCHAIN" \
            | sed -n 's/.*"\(Developer ID Application:[^"]*\)".*/\1/p' \
            | head -1)"
          if [ -z "$signing_identity" ]; then
            echo "The supplied PKCS#12 contains no Developer ID Application identity." >&2
            exit 1
          fi

          xcrun notarytool store-credentials "$NOTARY_PROFILE" \
            --key "$api_key" \
            --key-id "$APPLE_NOTARY_KEY_ID" \
            --issuer "$APPLE_NOTARY_ISSUER_ID" \
            --keychain "$CRUXWING_CI_KEYCHAIN" \
            --validate >/dev/null

          echo "NOTARY_SIGN_ID=$signing_identity" >> "$GITHUB_ENV"

      - name: Build, sign and notarize both architectures
        run: bash app/dist-all.sh

      # Credentials are no longer needed after Apple has accepted and stapled
      # both images. Remove them even when the build fails.
      - name: Remove ephemeral Apple credentials
        if: always()
        run: |
          security delete-keychain "$CRUXWING_CI_KEYCHAIN" >/dev/null 2>&1 || true
          rm -f "$RUNNER_TEMP/cruxwing-developer-id.p12" "$RUNNER_TEMP/cruxwing-notary-key.p8"

      - name: Audit the exact distributable pair
        run: |
          set -euo pipefail
          bash scripts/audit-dmg.sh \
            app/dist/cruxwing-AppleSilicon.dmg \
            app/dist/cruxwing-Intel.dmg

      - name: Assemble checksums, cask and provenance record
        run: |
          set -euo pipefail
          bash scripts/release-manifest.sh "$RELEASE_TAG" app/dist "$RELEASE_OUTPUT"
          (cd "$RELEASE_OUTPUT" && shasum -a 256 -c SHA256SUMS)

      # This is independent of the self-reported stamps inside each app: GitHub
      # signs the externally calculated subject digests with a short-lived OIDC
      # identity tied to this workflow run.
      - name: Sign SLSA provenance for every candidate file
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: ${{ runner.temp }}/cruxwing-release-candidate/SHA256SUMS

      - name: Preserve the portable Sigstore bundle beside the candidate
        env:
          ATTESTATION_BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          set -euo pipefail
          test -s "$ATTESTATION_BUNDLE"
          cp "$ATTESTATION_BUNDLE" "$RELEASE_OUTPUT/cruxwing-attestation.sigstore.json"

      - name: Retain candidate for owner review (not a public release)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cruxwing-${{ inputs.tag }}-release-candidate
          path: ${{ runner.temp }}/cruxwing-release-candidate/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
