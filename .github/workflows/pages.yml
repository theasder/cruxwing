# Публикуем ровно содержимое `public/` через штатный GitHub Pages artifact.
# Workflow не получает Git-учётные данные и не создаёт/перезаписывает ветки.
name: Pages

on:
  push:
    branches: [main]
    paths: ['public/**', '.github/workflows/pages.yml']
  workflow_dispatch:

# Сборка страницы по умолчанию только читает репозиторий. Право на deployment
# добавлено ниже лишь одному job и ограничено Environment `github-pages`.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: GitHub Pages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Проверить публичную идентичность репозитория
        env:
          EXPECTED_REPOSITORY: theasder/orakul
        run: |
          set -euo pipefail
          if [ "$GITHUB_REPOSITORY" != "$EXPECTED_REPOSITORY" ]; then
            echo "Отказ: Pages для orakul нельзя публиковать из $GITHUB_REPOSITORY." >&2
            echo "Сначала владелец должен переименовать репозиторий в $EXPECTED_REPOSITORY." >&2
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Проверить публикуемый корень
        run: test -f public/index.html

      - name: Настроить GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Загрузить неизменяемый artifact страницы
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: public

      - name: Опубликовать artifact через GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

      - name: Убедиться, что отдаётся тот же сайт
        env:
          EXPECTED_PAGE_URL: https://theasder.github.io/orakul/
          DEPLOYED_PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          if [ "$DEPLOYED_PAGE_URL" != "$EXPECTED_PAGE_URL" ]; then
            echo "Отказ: Pages вернул неожиданный адрес $DEPLOYED_PAGE_URL" >&2
            exit 1
          fi

          # CDN обновляется не обязательно одновременно с ответом deployment.
          # `/ru/` раньше содержал landing другого продукта и обязан остаться 404.
          want_root=$(grep -o '<title>[^<]*</title>' public/index.html)
          for i in $(seq 1 12); do
            got_root=$(curl -fsS --max-time 10 "$DEPLOYED_PAGE_URL" \
                       | grep -o '<title>[^<]*</title>' || true)
            if [ "$got_root" = "$want_root" ]; then
              echo "отдаётся /: $got_root"
              code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 \
                     "${DEPLOYED_PAGE_URL}ru/" || true)
              if [ "$code" = "404" ]; then
                echo "/ru/ не отдаётся — так и задумано"
                exit 0
              fi
              echo "!! /ru/ отдаётся (код $code) — это не часть сайта orakul" >&2
              exit 1
            fi
            sleep 10
          done
          echo "страница так и не обновилась" >&2
          echo "последнее /: ${got_root:-пусто}" >&2
          exit 1
