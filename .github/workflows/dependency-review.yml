# Public repositories receive GitHub's dependency graph automatically. Keep
# this PR gate dormant while the repository is private: without GitHub Code
# Security/Advanced Security the Dependency Review API is unavailable there.
name: Dependency review

on:
  pull_request:

permissions:
  contents: read

jobs:
  review:
    name: No newly vulnerable dependencies
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the proposed dependency files
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Compare the dependency graph with the pull request base
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: never
          retry-on-snapshot-warnings: true
          retry-on-snapshot-warnings-timeout: 60
